<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M94</title><link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0","three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/"}}</script></head>
<body>
<section id="gate"><form id="login"><input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="Пароль" aria-label="Пароль"><div id="login-error"></div></form></section>
<main id="editor" class="hidden">
<header class="toolbar"><div class="brand">M94 <span>EDITOR</span></div><div class="tools"><button id="import-button">Импорт</button><button id="add-box">＋ Куб</button><button id="add-sphere">＋ Сфера</button><button id="add-cylinder">＋ Цилиндр</button><input id="file-input" type="file" accept=".glb,.gltf,.obj" multiple hidden></div><button id="logout" class="quiet">Выйти</button></header>
<section id="viewport"><div id="stage"></div><div id="viewport-label">VIEWPORT</div></section>
<aside class="sidebar">
<section><h3>Объекты</h3><div id="objects"><p class="empty">Сцена пока пустая</p></div></section>
<section><h3>Преобразование</h3><div class="mode-buttons"><button data-mode="translate" class="active">Переместить</button><button data-mode="rotate">Вращать</button><button data-mode="scale">Размер</button></div>
<div class="axis-row"><label>X <input id="pos-x" type="number" step=".1" value="0"></label><label>Y <input id="pos-y" type="number" step=".1" value="0"></label><label>Z <input id="pos-z" type="number" step=".1" value="0"></label></div>
<button id="delete" class="delete">Удалить объект</button></section>
<section><h3>Сцена</h3><label class="check"><input id="grid-toggle" type="checkbox" checked> Сетка</label><label class="check"><input id="ground-toggle" type="checkbox" checked> Пол</label></section>
</aside></main>
<script type="module" src="./main.js"></script></body></html>
