<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151e">
<title>M94 — HAPPY BIRTHDAY</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="game">
  <div id="stage"></div>
  <div class="brand">M94 <span>DREAM DRIVE</span></div>
  <div class="hud"><span class="hud-dot"></span><span id="status">A LITTLE BIRTHDAY JOURNEY</span></div>
  <section id="intro" class="overlay">
    <div class="eyebrow">A SPECIAL DELIVERY</div>
    <h1>DREAM<br><i>DRIVE</i></h1>
    <p>Одна дорога. Одна легенда.<br>И кое-что особенное в конце.</p>
    <button id="start">НАЧАТЬ ПОЕЗДКУ <span>↗</span></button>
    <div class="controls-note">W A S D / ← ↑ ↓ → &nbsp; ДЛЯ УПРАВЛЕНИЯ</div>
  </section>
  <section id="finish" class="overlay hidden">
    <div class="eyebrow">YOU MADE IT</div>
    <h2>HAPPY<br><i>BIRTHDAY!</i></h2>
    <p>Пусть впереди будет ещё<br>много красивых дорог.</p>
    <button id="again">ПРОЕХАТЬ ЕЩЁ РАЗ <span>↻</span></button>
  </section>
  <div id="jump-flash" class="jump-flash hidden">WOOOO!</div>
  <div class="bottom-hint" id="bottom-hint">W / ↑ — ГАЗ &nbsp;&nbsp; A D / ← → — РУЛЬ</div>
  <div class="touch-controls">
    <button id="left">←</button><button id="gas">↑</button><button id="right">→</button>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
