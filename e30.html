<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111820">
<title>BMW E30 — M94</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:#eef2f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.panel{position:fixed;left:22px;top:20px;z-index:2;pointer-events:none;text-shadow:0 2px 14px #000}
.tools{position:fixed;right:18px;top:18px;z-index:4;display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;max-width:min(520px,65vw)}.tools button,.tools label{border:1px solid #ffffff45;border-radius:9px;background:#101820df;color:#fff;padding:9px 11px;font:inherit;font-size:11px;cursor:pointer;backdrop-filter:blur(10px)}.tools input{display:none}.tools button:hover,.tools label:hover{background:#293b49}.tools .save{border-color:#e6b77d;color:#ffe0b8}@media(max-width:700px){.tools{left:12px;right:12px;top:auto;bottom:62px;justify-content:center}.tools button,.tools label{font-size:10px;padding:8px}}
.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#e6b77d}
h1{font-size:clamp(22px,4vw,38px);letter-spacing:-.04em;margin:7px 0 4px}.hint{font-size:12px;color:#c3ccd5}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;padding:14px 18px;border:1px solid #ffffff30;border-radius:12px;background:#101820df;backdrop-filter:blur(12px);font-size:13px;text-align:center;max-width:min(88vw,460px);line-height:1.5}
#status.error{color:#ffd0c7;border-color:#b96b5c}
#reset{position:fixed;right:18px;bottom:18px;z-index:3;border:1px solid #ffffff45;border-radius:99px;background:#101820cc;color:#fff;padding:11px 16px;font:inherit;font-size:12px;cursor:pointer}
@media(max-width:600px){.panel{left:15px;top:14px}.hint{max-width:250px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}</script>
</head>
<body>
<div id="scene"></div>
<header class="panel"><div class="eyebrow">M94 · 3D VIEW</div><h1>BMW E30 Sedan</h1><div class="hint">Перетаскивай мышью — вращение · Колесо — приближение</div></header>
<div id="status">Загружаю BMW E30 с GitHub…</div>
<div class="tools"><button id="uvBody" type="button">UV кузова PNG</button><button id="uvWheels" type="button">UV колёс PNG</button><label>Текстура кузова<input id="bodyTexture" type="file" accept="image/png,image/jpeg"></label><label>Текстура колёс<input id="wheelTexture" type="file" accept="image/png,image/jpeg"></label><button id="modelReport" type="button">Отчёт о деталях</button><button id="saveModel" class="save" type="button">Сохранить BMW GLB ≤25 МБ</button></div><button id="reset" type="button">Сбросить вид</button>
<script type="module">
const status=document.querySelector('#status');
let THREE, USDLoader, OrbitControls;
try {
  [THREE, { USDLoader }, { OrbitControls }] = await Promise.all([
    import('three'),
    import('three/addons/loaders/USDLoader.js'),
    import('three/addons/controls/OrbitControls.js')
  ]);
} catch (error) {
  status.classList.add('error');
  status.textContent='Ошибка подключения 3D-библиотеки: '+(error?.message || String(error));
  throw error;
}

const host=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#aebbc4');
scene.fog=new THREE.Fog('#aebbc4',35,100);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,1000);
camera.position.set(7,4.2,8);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf3ff,0x59616a,2.1));
const key=new THREE.DirectionalLight(0xffe3c4,3.2);
key.position.set(-6,12,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const fill=new THREE.DirectionalLight(0xd2e5ff,1.1);fill.position.set(7,5,-8);scene.add(fill);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#858b8d',roughness:.92}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.025;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(100,100,'#59636a','#737d82');grid.position.y=-.018;grid.material.opacity=.18;grid.material.transparent=true;scene.add(grid);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;controls.target.set(0,1,0);
controls.minDistance=1;controls.maxDistance=45;controls.maxPolarAngle=Math.PI*.49;

let loadedModel=null;
let initialCamera=new THREE.Vector3(7,4.2,8);
let initialTarget=new THREE.Vector3(0,1,0);
document.querySelector('#reset').addEventListener('click',()=>{
 camera.position.copy(initialCamera);controls.target.copy(initialTarget);controls.update();
});

const modelUrl='https://raw.githubusercontent.com/WebWklep/M94/main/models/e30/BMW_3_Series_E30_Sedan.usdz';
const loader=new USDLoader();
loader.load(modelUrl,model=>{
 loadedModel=model;
 model.traverse(o=>{
  if(!o.isMesh) return;
  o.castShadow=true;
  o.receiveShadow=true;
  const materials=Array.isArray(o.material)?o.material:[o.material];
  for(const mat of materials){
   if(!mat) continue;
   const isGlass=/glass|window|windshield|windscreen|glazing/i.test(mat.name||'');
   if(!isGlass){
    mat.transparent=false;
    mat.opacity=1;
    mat.depthWrite=true;
    if('transmission' in mat) mat.transmission=0;
    if('alphaTest' in mat) mat.alphaTest=0;
    mat.needsUpdate=true;
   }
  }
 });
 scene.add(model);
 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());
 const center=bounds.getCenter(new THREE.Vector3());
 model.position.sub(center);
 const span=Math.max(size.x,size.y,size.z);
 initialCamera.set(span*1.35,span*.72,span*1.55);
 initialTarget.set(0,size.y*.12,0);
 camera.position.copy(initialCamera);
 camera.near=Math.max(.01,span/1000);camera.far=span*100;camera.updateProjectionMatrix();
 controls.target.copy(initialTarget);
 controls.minDistance=span*.35;controls.maxDistance=span*8;controls.update();
 floor.position.y=-size.y*.5;
 grid.position.y=floor.position.y+.008;
 key.position.set(-span*.7,span*1.8,span);
 key.shadow.camera.left=-span;key.shadow.camera.right=span;key.shadow.camera.top=span;key.shadow.camera.bottom=-span;
 status.style.display='none';
},xhr=>{
 if(xhr.total){const p=Math.round(xhr.loaded/xhr.total*100);status.textContent='Загружаю модель… '+p+'%';}
},err=>{
 console.error(err);
 status.classList.add('error');
 status.textContent='Ошибка загрузки USDZ: '+(err?.message || String(err));
});


function isWheelObject(o){const s=((o.name||'')+' '+(o.material?.name||'')).toLowerCase();return /wheel|tire|tyre|rim|brake|шина|диск|колес/.test(s);}
function exportUV(kind){if(!loadedModel){alert('Дождись загрузки машины.');return;}const canvas=document.createElement('canvas');canvas.width=4096;canvas.height=4096;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,4096,4096);ctx.strokeStyle='#252b31';ctx.lineWidth=2;let count=0;loadedModel.updateMatrixWorld(true);loadedModel.traverse(o=>{if(!o.isMesh||!o.geometry?.attributes?.uv)return;const wheel=isWheelObject(o);if((kind==='wheels'&&!wheel)||(kind==='body'&&wheel))return;const g=o.geometry,uv=g.attributes.uv,index=g.index,total=index?index.count:uv.count;ctx.beginPath();for(let i=0;i+2<total;i+=3){const a=index?index.getX(i):i,b=index?index.getX(i+1):i+1,c=index?index.getX(i+2):i+2;const ax=uv.getX(a)*4096,ay=(1-uv.getY(a))*4096,bx=uv.getX(b)*4096,by=(1-uv.getY(b))*4096,cx=uv.getX(c)*4096,cy=(1-uv.getY(c))*4096;ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(cx,cy);ctx.closePath();count++;}ctx.stroke();});if(!count){alert('UV-координаты для этой группы не найдены.');return;}const a=document.createElement('a');a.download='BMW_E30_'+(kind==='body'?'BODY':'WHEELS')+'_UV.png';a.href=canvas.toDataURL('image/png');a.click();}
function applyTexture(file,kind){if(!loadedModel||!file)return;const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{const texture=new THREE.Texture(image);texture.colorSpace=THREE.SRGBColorSpace;texture.flipY=true;texture.wrapS=THREE.RepeatWrapping;texture.wrapT=THREE.RepeatWrapping;texture.needsUpdate=true;loadedModel.traverse(o=>{if(!o.isMesh)return;const wheel=isWheelObject(o);if((kind==='wheels'&&!wheel)||(kind==='body'&&wheel))return;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m){m.map=texture;m.color.set(0xffffff);m.needsUpdate=true;}});});URL.revokeObjectURL(url);};image.onerror=()=>{alert('Не удалось прочитать изображение.');URL.revokeObjectURL(url);};image.src=url;}
document.querySelector('#uvBody').addEventListener('click',()=>exportUV('body'));document.querySelector('#uvWheels').addEventListener('click',()=>exportUV('wheels'));document.querySelector('#bodyTexture').addEventListener('change',e=>applyTexture(e.target.files[0],'body'));document.querySelector('#wheelTexture').addEventListener('change',e=>applyTexture(e.target.files[0],'wheels'));
document.querySelector('#modelReport').addEventListener('click',()=>{
 if(!loadedModel){alert('Дождись загрузки машины.');return;}
 const lines=['BMW E30 — отчёт UV / детали',''];
 loadedModel.traverse(o=>{
  if(!o.isMesh)return;
  const mats=Array.isArray(o.material)?o.material:[o.material];
  lines.push('MESH: '+(o.name||'(без имени)')+' | vertices: '+(o.geometry?.attributes?.position?.count||0)+' | UV: '+(o.geometry?.attributes?.uv?'yes':'NO'));
  mats.forEach((m,i)=>lines.push('  MATERIAL '+i+': '+(m?.name||'(без имени)')+' | map: '+!!m?.map+' | transparent: '+!!m?.transparent));
 });
 const blob=new Blob([lines.join('\\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BMW_E30_model_report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
});
document.querySelector('#saveModel').addEventListener('click',async()=>{if(!loadedModel){alert('Дождись загрузки машины.');return;}try{const {GLTFExporter}=await import('three/addons/exporters/GLTFExporter.js');new GLTFExporter().parse(loadedModel,result=>{const blob=new Blob([result],{type:'model/gltf-binary'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='My_BMW_E30.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);},error=>alert('Ошибка экспорта: '+(error?.message||String(error))),{binary:true,onlyVisible:true,maxTextureSize:1024,forceIndices:true});}catch(error){alert('Экспорт не запустился: '+(error?.message||String(error)));}});

function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera)}render();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
